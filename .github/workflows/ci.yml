name: CI

# Supported platforms: Linux (ubuntu-latest) only.
# macOS and Windows builds are NOT supported: pyrecon and its transitive
# dependencies (pyfftw, mpytools) require native compilation that is
# unavailable or untested on those platforms.  Do not add macOS/Windows
# matrix entries without first verifying a clean install.

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Minimal read-only permissions for the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pyrecon (pinned commit; numpy 2-compatible)
        # Pinned to 7d1e6c24 — the commit that adds numpy>=2 copy=False fix.
        # If this install fails the job fails (no silent skip — fail closed).
        run: |
          pip install "pyrecon @ git+https://github.com/cosmodesi/pyrecon@7d1e6c24598a05134c5958d109d9bcc7136ff83d"

      - name: Run unit tests
        run: |
          pip install pytest
          pytest tests/ -v --tb=short

  lightweight-pipeline:
    name: Lightweight pipeline smoke-test (full --stage all)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pyrecon (pinned commit; numpy 2-compatible)
        # Pinned to 7d1e6c24 — the commit that adds numpy>=2 copy=False fix.
        # If this install fails the job fails (no silent skip — fail closed).
        run: |
          pip install "pyrecon @ git+https://github.com/cosmodesi/pyrecon@7d1e6c24598a05134c5958d109d9bcc7136ff83d"

      - name: Create output directories
        run: |
          mkdir -p outputs/snapshots outputs/figures outputs/mcmc

      - name: Run full lightweight pipeline (ics → nbody → lognormal → pk → recon → mcmc)
        # --stage all runs every stage end-to-end using the deterministic
        # ci_lightweight config (N=16^3, 5 leapfrog steps, 500 MCMC samples).
        # Must be run from src/ so bare imports (from utils import ...) resolve.
        run: |
          cd src
          python main.py --config ../configs/ci_lightweight.yaml --stage all
